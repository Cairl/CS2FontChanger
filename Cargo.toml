[package]
name = "cs2-font-changer"
version = "3.10.0"
edition = "2021"
description = "CS2 Font Changer - customize Counter-Strike 2 fonts"
authors = ["Cairl"]
license = "MIT"

[[bin]]
name = "cs2_font_changer"
path = "source/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Com",
    "Win32_System_Ole",
] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
